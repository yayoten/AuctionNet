[pytest]
# このフォルダ（Test/1_初期セットアップ）で `pytest` を実行する。
# 本家コード（github/）は変更せず、そのまま import して検証する。
testpaths = .
python_files = test_*.py
addopts = -ra --strict-markers --tb=short -p no:cacheprovider
timeout = 900
markers =
    slow: 数十秒〜数分かかるテスト（-m "not slow" で除外できる）
    full_scale: 本家の設定どおり PVNUM=500000・48エージェント・2エピソードで回す重いテスト
filterwarnings =
    ignore::DeprecationWarning
    ignore::FutureWarning
    ignore::UserWarning
