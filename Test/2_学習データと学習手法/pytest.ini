[pytest]
# このフォルダ（Test/2_学習データと学習手法）で `pytest` を実行する。
testpaths = .
python_files = test_*.py
addopts = -ra --strict-markers --tb=short -p no:cacheprovider
timeout = 1800
markers =
    needs_data: 公開データ（dataset/、約80GB）が要るテスト。無い端末では理由を表示してスキップする
    slow: 数十秒〜数分かかるテスト（-m "not slow" で除外できる）
filterwarnings =
    ignore::DeprecationWarning
    ignore::FutureWarning
    ignore::UserWarning
