[pytest]
# このフォルダ（github/Test/3_実験記録の拡充）で `pytest` を実行する。
testpaths = .
python_files = test_*.py
addopts = -ra --strict-markers --tb=short -p no:cacheprovider
timeout = 1800
markers =
    slow: 数十秒〜数分かかるテスト（-m "not slow" で除外できる）
    needs_db: DB/runs/ に、照合の相手の run が要るテスト。無い端末では理由を表示してスキップする
filterwarnings =
    ignore::DeprecationWarning
    ignore::FutureWarning
    ignore::UserWarning
